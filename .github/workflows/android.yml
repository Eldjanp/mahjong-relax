name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../MahjongRelax.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MahjongRelax-apk
          path: MahjongRelax.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mahjong Relax v1.0.${{ github.run_number }}
          body: |
            Shkarko **MahjongRelax.apk** në telefonin Android dhe instaloje.
            (Mund t'ju kërkohet të lejoni "Instalimin nga burime të panjohura".)
          files: MahjongRelax.apk
